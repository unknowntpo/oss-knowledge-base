<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Spec 024 DM1/DM3: set the theme before the stylesheet and the app load, so a dark OS never
         sees a light first paint. The stored choice (osskb.theme: light, dark or system) wins; system
         follows prefers-color-scheme, also when it changes. Storage errors fall back to system. -->
    <script>
      (function () {
        var root = document.documentElement;
        var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
        function stored() {
          try {
            var value = window.localStorage.getItem("osskb.theme");
            return value === "light" || value === "dark" ? value : "system";
          } catch (error) {
            return "system";
          }
        }
        function apply() {
          var choice = stored();
          root.dataset.theme = choice === "system" ? (query && query.matches ? "dark" : "light") : choice;
        }
        apply();
        if (query) {
          var onChange = function () { if (stored() === "system") apply(); };
          if (query.addEventListener) query.addEventListener("change", onChange);
          else if (query.addListener) query.addListener(onChange);
        }
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#16161a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101013" />
    <title>Open Source Community Knowledge Base</title>
    <meta name="description" content="Evidence-first search and activity feed for open-source communities." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
