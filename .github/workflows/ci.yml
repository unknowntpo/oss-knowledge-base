name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation:
        description: Select verify for CI or bootstrap-r2 for the one-time data bootstrap
        required: true
        type: choice
        default: verify
        options:
          - verify
          - bootstrap-r2
      confirmation:
        description: Type bootstrap-isolated-r2 only when operation is bootstrap-r2
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.operation || 'verify' }}
  cancel-in-progress: ${{ inputs.operation != 'bootstrap-r2' }}

jobs:
  static:
    name: Typecheck and build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Check spec traceability and generated test plans
        run: bun run check:traceability && bun run check:test-plan
      - run: bun run build
      - name: Retain the exact verified web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 3

  unit:
    name: Unit tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  integration:
    name: Integration tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  fluss-flink-compat:
    name: Fluss/Flink compatibility
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: spikes/fluss-flink-compat/pom.xml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: mvn -B verify -f spikes/fluss-flink-compat/pom.xml
      - run: bun run test:fluss-flink-cluster

  e2e:
    name: E2E — local R2, Pages Functions, Vue
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-development:
    name: Deploy development
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [static, unit, integration, e2e, fluss-flink-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development
      url: https://oss-knowledge-base-dev.pages.dev
    concurrency:
      group: pages-development
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy the verified artifact to development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun apps/web/scripts/deploy-pages.ts development --commit-hash=${{ github.sha }}
      - name: Deploy the isolated development data publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd apps/data-publisher-worker deploy:development
      - name: Require provisioned development runtime secrets
        working-directory: apps/data-publisher-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          configured="$(bunx wrangler secret list -c wrangler.development.jsonc)"
          grep -q 'GITHUB_SOURCE_TOKEN' <<<"$configured"
          grep -q 'MANUAL_TRIGGER_TOKEN' <<<"$configured"

  e2e-development:
    name: E2E — deployed development
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [deploy-development]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: development
      url: https://oss-knowledge-base-dev.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Verify the deployed development data path
        env:
          DEV_BASE_URL: https://oss-knowledge-base-dev.pages.dev
          DEV_WORKER_URL: https://oss-knowledge-base-data-dev.unknowntpo.workers.dev
          # Cloudflare Access service token for the Dev Pages site. Sent only to the
          # Dev Pages origin (scripts/verify/access.ts); empty until the secrets exist.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bun run test:e2e:development
      # Playwright evidence can hold request headers (the HTML report's step errors,
      # traces). Replace the token values, then fail if any copy is left, before upload.
      - name: Redact the Access token from the evidence
        id: redact
        if: ${{ !cancelled() }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bun scripts/verify/redact-artifacts.ts playwright-report-development test-results/playwright-development
      - name: Upload deployed development evidence
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-development-evidence
          path: |
            playwright-report-development
            test-results/playwright-development
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Deploy production
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [static, unit, integration, e2e, fluss-flink-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://oss-knowledge-base.pages.dev
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Require a SemVer tag reachable from main
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH syntax."
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy the verified artifact to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun apps/web/scripts/deploy-pages.ts production --commit-hash=${{ github.sha }}
      - name: Deploy the isolated production data publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run --cwd apps/data-publisher-worker deploy:production
      - name: Require provisioned production runtime secrets
        working-directory: apps/data-publisher-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          configured="$(bunx wrangler secret list -c wrangler.production.jsonc)"
          grep -q 'GITHUB_SOURCE_TOKEN' <<<"$configured"
          grep -q 'MANUAL_TRIGGER_TOKEN' <<<"$configured"

  bootstrap-r2-development:
    name: Bootstrap development R2
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-r2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLICATION_ENVIRONMENT: development
      R2_BUCKET: oss-knowledge-base-dev
      CONFIRM_R2_PUBLISH: development:oss-knowledge-base-dev
    steps:
      - name: Require exact bootstrap confirmation
        run: test "${{ inputs.confirmation }}" = "bootstrap-isolated-r2"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Require scoped Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Create development bucket when absent
        working-directory: apps/web
        run: |
          if ! bunx wrangler r2 bucket info "$R2_BUCKET" >/dev/null 2>&1; then
            bunx wrangler r2 bucket create "$R2_BUCKET"
          fi
      - name: Prepare the version-controlled Feed snapshot
        run: bun run --cwd apps/web fixture:recorded-feed:seed
      - name: Publish recorded Feed manifest-last
        run: bun apps/github-publisher/scripts/publish-r2.ts
      - name: Publish recorded Search pointer-last
        run: bun apps/web/scripts/publish-search-r2.ts --remote

  bootstrap-r2-production:
    name: Bootstrap production R2
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-r2' }}
    needs: bootstrap-r2-development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLICATION_ENVIRONMENT: production
      R2_BUCKET: oss-knowledge-base-prod
      CONFIRM_R2_PUBLISH: production:oss-knowledge-base-prod
    steps:
      - name: Require exact bootstrap confirmation
        run: test "${{ inputs.confirmation }}" = "bootstrap-isolated-r2"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Require scoped Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Create production bucket when absent
        working-directory: apps/web
        run: |
          if ! bunx wrangler r2 bucket info "$R2_BUCKET" >/dev/null 2>&1; then
            bunx wrangler r2 bucket create "$R2_BUCKET"
          fi
      - name: Prepare the version-controlled Feed snapshot
        run: bun run --cwd apps/web fixture:recorded-feed:seed
      - name: Publish the same recorded Feed manifest-last
        run: bun apps/github-publisher/scripts/publish-r2.ts
      - name: Publish the same recorded Search pointer-last
        run: bun apps/web/scripts/publish-search-r2.ts --remote
