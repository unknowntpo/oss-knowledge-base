name: Confluence ingest (M1)

# Polls cwiki.apache.org for the 9 followed KIPs and applies deterministic
# frontmatter (the additive cwiki block) + records drift. Test-then-act CI
# discipline: viewer tests must pass before the poll runs, and we commit only
# when the working tree is actually dirty.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in --dry-run mode (writes nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: confluence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Test-then-act: never mutate the vault on a red build.
      - name: Install + test viewer
        working-directory: viewer
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Run ingest (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bun tools/ingest/run.ts --dry-run

      - name: Run ingest
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: bun tools/ingest/run.ts

      - name: Checkpoint changes on the automation branch
        id: checkpoint
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          AUTOMATION_BRANCH: automation/confluence-ingest
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — nothing to commit (idempotent no-op)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$AUTOMATION_BRANCH"
          git add -A
          git commit -m "chore(ingest): confluence sync $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin "HEAD:refs/heads/$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the human review notice
        if: ${{ steps.checkpoint.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/confluence-ingest
          NOTICE_TITLE: "Automation review: Confluence ingest is ready"
        run: |
          review_url="https://github.com/$GITHUB_REPOSITORY/compare/main...$AUTOMATION_BRANCH?expand=1"

          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            'Confluence ingestion changes are checkpointed and ready for human review.' \
            "Review or open the pull request: $review_url" \
            "Automation branch: \`$AUTOMATION_BRANCH\`" \
            "Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Automation cannot approve or merge this change.')
          issue_number=$(gh issue list \
            --state open \
            --search "\"$NOTICE_TITLE\" in:title" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body "$body"
          else
            gh issue create --title "$NOTICE_TITLE" --body "$body"
          fi
